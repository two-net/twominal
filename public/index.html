<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VS Code Pets Webview</title>
  <link href="./reset.css" rel="stylesheet">
  <link href="./pets.css" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'silkscreen';
      src: url('./Silkscreen-Regular.ttf') format('truetype');
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    #petCanvasContainer, #foreground, #background, #petsContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #petsContainer {
      z-index: 10;
      pointer-events: none;
    }
    img.pet {
      pointer-events: auto !important;
      z-index: 10 !important;
    }
    .collision {
      pointer-events: auto !important;
      z-index: 15 !important;
    }
    .bubble {
      z-index: 20 !important;
    }
  </style>
</head>
<body>
  <div id="petCanvasContainer">
    <canvas id="ballCanvas"></canvas>
    <canvas id="foregroundEffectCanvas"></canvas>
    <canvas id="backgroundEffectCanvas"></canvas>
  </div>
  <div id="petsContainer"></div>
  <div id="foreground"></div>
  <div id="background"></div>

  <script>
    // Provide VS Code webview API shim
    window.acquireVsCodeApi = function() {
      return {
        getState: function() {
          try {
            const raw = localStorage.getItem('vscode-pets-state');
            if (!raw) return null;
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.petStates) && parsed.petStates.length > 0) {
              return parsed;
            }
            return null;
          } catch(e) {
            return null;
          }
        },
        setState: function(state) {
          try {
            localStorage.setItem('vscode-pets-state', JSON.stringify(state));
          } catch(e) {}
        },
        postMessage: function(msg) {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(msg, '*');
          }
        }
      };
    };
  </script>
  <script src="./main-bundle.js"></script>
  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const theme = urlParams.get('theme') || 'castle';
      const themeKind = parseInt(urlParams.get('themeKind') || '2'); // 2 = Dark
      const petColor = urlParams.get('petColor') || 'brown';
      const petSize = urlParams.get('petSize') || 'nano';
      const petType = urlParams.get('petType') || 'cat';
      const throwBallWithMouse = urlParams.get('throwBallWithMouse') !== 'false';
      const disableEffects = urlParams.get('disableEffects') === 'true';

      // Base path for all pet GIF assets (without trailing slash)
      const basePetUri = new URL('./', window.location.href).href.replace(/\/+$/, '');

      console.log('[vscode-pets] Initializing with basePetUri:', basePetUri);

      if (window.petApp && window.petApp.petPanelApp) {
        window.petApp.petPanelApp(
          basePetUri,
          theme,
          themeKind,
          petColor,
          petSize,
          petType,
          throwBallWithMouse,
          disableEffects
        );
      } else {
        console.error('[vscode-pets] petApp.petPanelApp not found in main-bundle.js');
      }
    })();
  </script>
</body>
</html>
