name: Unsigned packages
run-name: Unsigned packages from ${{ github.ref_name }}

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  TWOMINAL_NODE_VERSION: "22.23.2"
  TWOMINAL_RUST_VERSION: "1.88.0"

concurrency:
  group: unsigned-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.name }} unsigned packages
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            platform: linux
            os: ubuntu-22.04
            bundles: deb,appimage
            paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*_AppImage.tar.gz
          - name: macOS
            platform: macos
            os: macos-14
            bundles: dmg
            paths: src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows
            platform: windows
            os: windows-2022
            bundles: nsis,msi
            paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install declared Rust toolchain
        run: |
          rustup toolchain install "${{ env.TWOMINAL_RUST_VERSION }}" --profile minimal --no-self-update
          rustup default "${{ env.TWOMINAL_RUST_VERSION }}"

      - name: Install declared Node.js toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.TWOMINAL_NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release metadata
        run: npm run check:metadata

      - name: Build unsigned packages
        run: npm run tauri -- build --bundles "${{ matrix.bundles }}" --ci --no-sign -- --locked

      - name: Preserve AppImage executable permissions
        if: runner.os == 'Linux'
        working-directory: src-tauri/target/release/bundle/appimage
        run: tar -czf Twominal_AppImage.tar.gz -- *.AppImage

      - name: Upload unsigned packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: twominal-${{ matrix.platform }}-${{ runner.arch }}-${{ github.sha }}-unsigned
          path: ${{ matrix.paths }}
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
