name: Release
run-name: Draft release for ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  TWOMINAL_NODE_VERSION: "22.23.2"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install declared Node.js toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.TWOMINAL_NODE_VERSION }}
          cache: npm

  package:
    name: Build release packages
    needs: validate
    uses: ./.github/workflows/package-unsigned.yml

  release:
    name: Create draft GitHub Release
    needs:
      - validate
      - package
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: twominal-*-${{ github.sha }}-unsigned
          path: downloaded-packages

      - name: Collect and checksum release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets

          while IFS= read -r -d '' artifact; do
            filename="$(basename "$artifact")"
            destination="release-assets/$filename"
            if [[ -e "$destination" ]]; then
              echo "Duplicate release asset name: $filename" >&2
              exit 1
            fi
            cp "$artifact" "$destination"
          done < <(find downloaded-packages -type f -print0)

          shopt -s nullglob
          deb=(release-assets/*.deb)
          appimage=(release-assets/*_AppImage.tar.gz)
          dmg=(release-assets/*.dmg)
          exe=(release-assets/*.exe)
          msi=(release-assets/*.msi)
          assets=(release-assets/*)

          if (( ${#deb[@]} != 1 || ${#appimage[@]} != 1 || ${#dmg[@]} != 1 || ${#exe[@]} != 1 || ${#msi[@]} != 1 || ${#assets[@]} != 5 )); then
            echo "Expected exactly one DEB, AppImage archive, DMG, EXE, and MSI release asset." >&2
            find release-assets -maxdepth 1 -type f -print >&2
            exit 1
          fi

          (
            cd release-assets
            sha256sum -- * > SHA256SUMS.txt
          )

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          warning=$'> [!WARNING]\n> These are unsigned staging packages. Replace them with signed/notarized packages and regenerate `SHA256SUMS.txt` before publishing this draft.'

          if is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $RELEASE_TAG already exists and is published; refusing to replace its assets." >&2
              exit 1
            fi

            release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .id)"
            asset_ids_file="$RUNNER_TEMP/twominal-release-asset-ids"
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
              --jq '.[].id' > "$asset_ids_file"
            while IFS= read -r asset_id; do
              if [[ ! "$asset_id" =~ ^[0-9]+$ ]]; then
                echo "Invalid release asset ID: $asset_id" >&2
                exit 1
              fi
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done < "$asset_ids_file"
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Twominal ${RELEASE_TAG#v} (unsigned draft)" \
              --generate-notes \
              --notes "$warning"
          fi
