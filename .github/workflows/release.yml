# Build Twominal for every desktop target and attach the installers to a
# GitHub Release.
#
# Trigger:
#   git tag v0.1.0 && git push origin v0.1.0
#   or run "Release" from the Actions tab (workflow_dispatch).
#
# The tag (without the leading v) must match package.json, Cargo.toml, and
# src-tauri/tauri.conf.json. Builds upload to a draft; the publish job
# undrafts it only after every platform succeeds so a half-finished release
# is never marked latest.
#
# Optional repo secrets for signed/notarized macOS builds (paid Apple Developer
# Program). Without them, macOS uses ad-hoc signing. Downloaded ad-hoc apps
# need a one-time right-click → Open on each Mac.
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  APPIMAGE_EXTRACT_AND_RUN: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint install.sh
        run: sh -n install.sh

      - name: Check versions agree
        run: |
          set -euo pipefail
          PKG=$(jq -r .version package.json)
          TAURI=$(jq -r .version src-tauri/tauri.conf.json)
          CARGO=$(awk '
            /^\[package\]/ { in_pkg = 1; next }
            /^\[/ { in_pkg = 0 }
            in_pkg && /^version = "/ {
              gsub(/^version = "|"$/, "")
              print
              exit
            }
          ' src-tauri/Cargo.toml)
          if [ "$PKG" != "$TAURI" ] || [ "$PKG" != "$CARGO" ]; then
            echo "::error::Version mismatch: package.json=$PKG tauri.conf.json=$TAURI Cargo.toml=$CARGO"
            exit 1
          fi
          echo "App version $PKG"

      - name: Check tag matches app version
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Git tag $GITHUB_REF_NAME does not match tauri.conf.json version $VERSION"
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS x64
            platform: macos-latest
            rust_targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Linux x64
            platform: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu
          - name: Linux arm64
            platform: ubuntu-22.04-arm
            rust_targets: aarch64-unknown-linux-gnu
            args: --target aarch64-unknown-linux-gnu
          - name: Windows x64
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            file \
            wget \
            xdg-utils \
            rpm

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          prefix-key: ${{ matrix.rust_targets }}

      - name: Install frontend dependencies
        run: npm ci

      # Tauri treats a *set-but-empty* APPLE_CERTIFICATE as "import this
      # cert" and fails with SecKeychainItemImport. Only export Apple vars
      # when the secrets have values; otherwise ad-hoc sign (`-`).
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERT" ]; then
            missing=()
            [ -n "$CERT_PASSWORD" ] || missing+=(APPLE_CERTIFICATE_PASSWORD)
            [ -n "$NOTARY_APPLE_ID" ] || missing+=(APPLE_ID)
            [ -n "$NOTARY_APPLE_PASSWORD" ] || missing+=(APPLE_PASSWORD)
            [ -n "$NOTARY_APPLE_TEAM_ID" ] || missing+=(APPLE_TEAM_ID)
            if (( ${#missing[@]} )); then
              echo "::error::APPLE_CERTIFICATE is set but notarization secrets are missing: ${missing[*]}"
              echo "::error::A Developer ID signature without notarization is still blocked by Gatekeeper."
              exit 1
            fi
            {
              echo "APPLE_CERTIFICATE<<EOF"
              printf '%s\n' "$CERT"
              echo "EOF"
              echo "APPLE_CERTIFICATE_PASSWORD<<EOF"
              printf '%s\n' "$CERT_PASSWORD"
              echo "EOF"
              echo "APPLE_ID<<EOF"
              printf '%s\n' "$NOTARY_APPLE_ID"
              echo "EOF"
              echo "APPLE_PASSWORD<<EOF"
              printf '%s\n' "$NOTARY_APPLE_PASSWORD"
              echo "EOF"
              echo "APPLE_TEAM_ID=$NOTARY_APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            if [ -n "$IDENTITY" ]; then
              echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
            fi
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "No APPLE_CERTIFICATE secret; using ad-hoc signing."
          fi

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Twominal ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            Installers for macOS, Windows, and Linux are attached below.

            - **macOS:** `curl --proto '=https' --proto-redir '=https' -fsSL https://raw.githubusercontent.com/two-net/twominal-grok/main/install.sh | sh` installs to `/Applications` and usually skips Gatekeeper (curl does not quarantine). Browser `.dmg` downloads are ad-hoc signed and not notarized: **right-click Twominal.app → Open → Open** the first time.
            - **Windows:** NSIS `.exe` or `.msi`. Unsigned; SmartScreen may warn.
            - **Linux:** `.deb`, `.rpm`, or `.AppImage`.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: ${{ github.ref_type == 'tag' && contains(github.ref_name, '-') }}
          uploadUpdaterJson: false
          retryAttempts: 3
          args: ${{ matrix.args }} -- --locked

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checksum assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION}"
          fi

          mkdir -p release-assets
          gh release download "$TAG" --repo "${{ github.repository }}" --dir release-assets
          rm -f release-assets/SHA256SUMS.txt

          shopt -s nullglob
          assets=(release-assets/*)
          dmg=(release-assets/*.dmg)
          deb=(release-assets/*.deb)
          win=(release-assets/*.exe release-assets/*.msi)
          if (( ${#assets[@]} < 1 || ${#dmg[@]} < 1 || ${#deb[@]} < 1 || ${#win[@]} < 1 )); then
            echo "Missing expected platform assets for $TAG" >&2
            ls -la release-assets >&2
            exit 1
          fi

          (
            cd release-assets
            sha256sum -- * > ../SHA256SUMS.txt
          )
          gh release upload "$TAG" SHA256SUMS.txt --repo "${{ github.repository }}" --clobber

          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease --repo "${{ github.repository }}"
          else
            gh release edit "$TAG" --draft=false --latest --repo "${{ github.repository }}"
          fi
          gh release view "$TAG" --repo "${{ github.repository }}"
