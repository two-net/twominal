[package]
name = "twominal"
version = "0.1.1"
authors = ["Twominal contributors"]
description = "A fast, cross-platform terminal emulator"
edition = "2021"
rust-version = "1.88"
publish = false
keywords = ["terminal", "pty", "tauri"]
categories = ["command-line-utilities", "gui"]

[lib]
name = "twominal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
crossbeam-channel = "0.5.16"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.20"
tauri = { version = "2.11.5", features = [] }
uuid = { version = "1.26.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
