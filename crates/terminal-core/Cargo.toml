[package]
name = "terminal-core"
version = "0.1.0"
description = "Twominal's Terminal Core: interprets a session's output and keeps its screen"
edition = "2021"
publish = false

# Every dependency must be listed in DESIGN.md §2 first (ARC-06) and must not reach for
# the interface, rendering or OS processes (ARC-02).
[dependencies]
# Exactly this version: `width.rs` corrects it where it differs from xterm, and was compared
# with it. Compare again before raising it.
unicode-width = { version = "=0.2.2", default-features = false }
vte = { version = "0.15", default-features = false }
# Find (TERM-18, TERM-19): the meta regex, without std. Its searches take time linear in the
# text, whatever the pattern (REL-02).
regex-automata = { version = "0.4", default-features = false, features = [
    "alloc",
    "syntax",
    "meta",
    "nfa-pikevm",
    "hybrid",
    "perf-literal-substring",
    "unicode",
] }

# cargo-fuzz builds with `--cfg fuzzing`, which makes `fuzz.rs` public for the fuzz crate.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
